apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ntfy
  namespace: ntfy
spec:
  description: "ntfy: reachable through the shared gateway, and talks to nothing."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: gateway-shared
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
