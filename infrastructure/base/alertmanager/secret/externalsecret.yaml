apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: slack/webhook-url
