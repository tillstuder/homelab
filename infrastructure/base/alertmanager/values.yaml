fullnameOverride: alertmanager

persistence:
  size: 1Gi

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

extraSecretMounts:
  - name: slack
    secretName: alertmanager-slack
    mountPath: /etc/alertmanager-secrets/slack-webhook-url
    subPath: webhook-url
    readOnly: true

config:
  global:
    resolve_timeout: 5m

  route:
    receiver: slack
    group_by: ["cluster"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - matchers: ['severity = "critical"']
        receiver: slack
        group_wait: 0s
        repeat_interval: 1h

  inhibit_rules:
    - source_matchers: ['severity = "critical"']
      target_matchers: ['severity = "warning"']
      equal: ["alertname", "namespace"]

  receivers:
    - name: slack
      slack_configs:
        - api_url_file: /etc/alertmanager-secrets/slack-webhook-url
          channel: "#homelab-alerts"
          send_resolved: true
          title: '{{ template "homelab.title" . }}'
          title_link: '{{ template "homelab.link" . }}'
          text: "Open Grafana for the details."
          fallback: '{{ template "homelab.fallback" . }}'
          footer: ""
          pretext: ""
          link_names: false

templates:
  homelab.tmpl: |-
    {{ define "homelab.severity" }}
      {{- with .CommonLabels.severity }}{{ . }}{{ else }}mixed{{ end }}
    {{- end }}

    {{ define "homelab.icon" }}
      {{- if ne .Status "firing" }}:white_check_mark:
      {{- else if eq .CommonLabels.severity "critical" }}:rotating_light:
      {{- else }}:red_circle:
      {{- end }}
    {{- end }}

    {{ define "homelab.title" }}
      {{- template "homelab.icon" . }} {{ .GroupLabels.cluster }}
      {{- " " }}{{ template "homelab.severity" . }}:
      {{- " " }}{{ .Alerts.Firing | len }} firing, {{ .Alerts.Resolved | len }} resolved
    {{- end }}

    {{ define "homelab.link" }}
      {{- "https://" }}{{ template "homelab.grafana" . }}
      {{- "/alerting/groups?alertmanager=Alertmanager" }}
    {{- end }}

    {{ define "homelab.fallback" }}
      {{- .GroupLabels.cluster }} {{ template "homelab.severity" . }}:
      {{- " " }}{{ .Alerts.Firing | len }} firing
    {{- end }}
