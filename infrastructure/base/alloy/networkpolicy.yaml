apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
  namespace: monitoring
spec:
  description: "Alloy: scrapes every component that exposes metrics, reads logs from the apiserver, writes both to the local stores."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9962"  # cilium-agent
              protocol: TCP
            - port: "9963"  # cilium-operator
              protocol: TCP
            - port: "9964"  # cilium-envoy
              protocol: TCP
            - port: "9965"  # hubble
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "9966"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/instance: argo-cd
      toPorts:
        - ports:
            - port: "8080"  # applicationset-controller
              protocol: TCP
            - port: "8082"  # application-controller
              protocol: TCP
            - port: "8083"  # server
              protocol: TCP
            - port: "8084"  # repo-server
              protocol: TCP
            - port: "9001"  # notifications-controller
              protocol: TCP
            - port: "9121"  # redis exporter
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
            app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: external-secrets
            app.kubernetes.io/instance: external-secrets
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kubelet-csr-approver
            app.kubernetes.io/instance: kubelet-csr-approver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: kube-state-metrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: node-exporter
            app.kubernetes.io/name: prometheus-node-exporter
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
