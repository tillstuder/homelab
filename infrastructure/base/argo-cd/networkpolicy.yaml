            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  description: "repo-server: the only pod in the cluster that reaches the internet."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argo-cd
      app.kubernetes.io/name: argocd-repo-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-application-controller
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-applicationset-controller
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-notifications-controller
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "8084"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toFQDNs:
        # git
        - matchName: "github.com"
        - matchName: "codeload.github.com"
        # Helm repos
        - matchName: "helm.cilium.io"
        - matchName: "charts.jetstack.io"
        - matchName: "charts.external-secrets.io"
        - matchPattern: "*.github.io"
        - matchPattern: "*.githubusercontent.com"
        # OCI registry for the envoy-gateway chart (docker.io/envoyproxy).
        # Manifests come from the registry, blobs from its CloudFront edge.
        - matchName: "registry-1.docker.io"
        - matchName: "auth.docker.io"
        - matchName: "production.cloudfront.docker.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  description: "redis: cache. Talks to nobody; three components talk to it."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argo-cd
      app.kubernetes.io/name: argocd-redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-repo-server
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-application-controller
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "9121"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-dex-server
  namespace: argocd
spec:
  description: "dex: reached by argocd-server only. No upstream IdP configured yet."
  endpointSelector:
