  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: argo-cd
            app.kubernetes.io/name: argocd-server
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
            - port: "5557"
              protocol: TCP
---
