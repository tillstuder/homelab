# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1" # what Grafana's sidecar watches for
configMapGenerator:
  - name: grafana-dashboard-cluster
    files:
      - ./cluster.json
  - name: grafana-dashboard-nodes
    files:
      - ./nodes.json
  - name: grafana-dashboard-workloads
    files:
      - ./workloads.json
  - name: grafana-dashboard-logs
    files:
      - ./logs.json
  - name: grafana-dashboard-platform
    files:
      - ./platform.json
  - name: grafana-dashboard-observability
    files:
      - ./observability.json
