apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  description: "local-path-provisioner: watches PVCs and drives node-local helper pods."
  endpointSelector:
    matchLabels:
      app: local-path-provisioner
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
