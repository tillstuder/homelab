apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-apiserver
spec:
  description: "Every pod in a platform namespace may reach the apiserver."
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
          - argocd
          - cert-manager
          - envoy-gateway-system
          - external-secrets
          - kube-system
          - kubelet-csr-approver
          - local-path-storage
          - monitoring
          - node-exporter
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
