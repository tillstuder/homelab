apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-health
spec:
  description: "cilium-health: every node probes every other node's health endpoint."
  endpointSelector:
    matchLabels:
      reserved:health: ""
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEntities:
        - host
        - remote-node
