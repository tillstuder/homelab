apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-cd-server
spec:
  parentRefs:
    - name: gateway-shared
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "argocd.dev.lab.cyseclab.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-cd-argocd-server
          port: 80
