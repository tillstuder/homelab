apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  commonName: "*.lab.cyseclab.net"
  dnsNames:
    - "lab.cyseclab.net"
    - "*.lab.cyseclab.net"
