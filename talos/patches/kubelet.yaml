machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    extraConfig:
      serverTLSBootstrap: true
    extraMounts:
      - destination: /var/mnt/local-path-provisioner
        type: bind
        source: /var/mnt/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
  features:
    kubePrism:
      enabled: true
      port: 7445
